[build-system]
requires = ["flit_core>=3.10,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "two-stage-sgd-dwd"
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Chang Cheng"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.flit.module]
name = "two_stage_sgd_dwd"

[tool.flit.sdist]
include = ["docs/", "examples/", "tests/", "CITATION.cff", "CHANGELOG.md", "VALIDATION.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

