[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "two-stage-sgd-dwd"
dynamic = ["version"]
description = "Projected and RKHS stochastic-gradient distance-weighted discrimination."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Chang Cheng"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.dynamic]
version = {attr = "two_stage_sgd_dwd.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["two_stage_sgd_dwd*"]
namespaces = false

[tool.setuptools.package-data]
two_stage_sgd_dwd = ["*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]

